/* ---------- IK 解算 ---------- */
function solveLimb(jp,tp,pole,a,b){
 const dir=tp.clone().sub(jp); let d=dir.length(); d=clamp(d,.03,a+b-.004);
 const dh=dir.normalize();
 const ca=clamp((a*a+d*d-b*b)/(2*a*d),-1,1), al=Math.acos(ca);
 let n=pole.clone().sub(dh.clone().multiplyScalar(pole.dot(dh)));
 if(n.lengthSq()<1e-6)n.set(0,0,1); n.normalize();
 const elbow=jp.clone().addScaledVector(dh,a*Math.cos(al)).addScaledVector(n,a*Math.sin(al));
 const ud=elbow.clone().sub(jp).normalize();
 const xw=n.clone().addScaledVector(ud,-n.dot(ud)).normalize();
 const yw=ud.clone().negate();
 const zw=new THREE.Vector3().crossVectors(xw,yw).normalize();
 const qUp=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(xw,yw,zw));
 const fd=tp.clone().sub(elbow).normalize();
 const th=Math.atan2(fd.dot(xw),fd.dot(ud));
 return {qUp,qEl:new THREE.Quaternion().setFromAxisAngle(V3(0,0,1),clamp(th,-2.6,.35))};}
const _v1=new THREE.Vector3(),_q1=new THREE.Quaternion();
function applyLimb(jointG,elbowG,jp,tp,pole,a,b,k){
 const s=solveLimb(jp,tp,pole,a,b);
 jointG.parent.getWorldQuaternion(_q1).invert();
 jointG.quaternion.slerp(_q1.clone().multiply(s.qUp),k);
 elbowG.quaternion.slerp(s.qEl,k);}

function kV(t,a,out){let i=a.length-1;for(let j=1;j<a.length;j++)if(t<=a[j][0]){i=j;break;}

let camYaw=.55,camPitch=.20,camDist=3.4,lastDrop=0;
const ptrs=new Map();let pinchD=0;
renderer.domElement.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptrs.size===2){const p=[...ptrs.values()];pinchD=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);}});
addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;
 const old=ptrs.get(e.pointerId);
 if(ptrs.size===1){camYaw-=(e.clientX-old[0])*.005;camPitch=clamp(camPitch+(e.clientY-old[1])*.005,-.05,1.25);}
 ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptrs.size===2){const p=[...ptrs.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
  camDist=clamp(camDist*pinchD/Math.max(1,d),1.3,14);pinchD=d;}});
addEventListener('pointerup',e=>ptrs.delete(e.pointerId));
renderer.domElement.addEventListener('wheel',e=>{camDist=clamp(camDist*Math.exp(e.deltaY*.001),1.3,14);},{passive:true});

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();let dt=.016;
function dampE(node,axis,target,k){node.rotation[axis]+=(target-node.rotation[axis])*k;}
function animate(){
 requestAnimationFrame(animate);
 dt=Math.min(.033,clock.getDelta());
 const t=S.t+=dt;
 const T=newT();
  switch(S.name){
   case 'idle':pIdle(T,t);break;
   case 'guard':pGuard(T,t);break;
   case 'port_arms':pPortArms(T,t);break;
   case 'walk':walkBase(T,t,{freq:.75,stride:.55,lift:.045,drop:0,lean:.08,speed:.4125,rifY:1.27,rp:0,bob:.02,push:.3});break;
  case 'crouch':walkBase(T,t,{freq:1.0,stride:.42,lift:.05,drop:.26,lean:.34,speed:.42,rifY:1.02,rp:-.06,bob:.015,push:.25});break;
  case 'stand_fire':pFireStand(T,t);break;
  case 'kneel_fire':pFireKneel(T,t);break;
  case 'prone_fire':pFireProne(T,t);break;
  case 'throw':pThrow(T,t);break;
  case 'sprint':walkBase(T,t,{freq:2.0,stride:1.05,lift:.13,drop:.05,lean:.30,speed:2.1,rifY:1.24,rp:-.10,bob:.035,push:.45});break;
   case 'death':pDeath(T,t);break;
   case 'death_fwd':pDeathFwd(T,t);break;
   case 'explode':pExplode(T,t);break;}
 const k=1-Math.exp(-dt*11);
 soldier.position.lerp(T.rp,k);soldier.quaternion.slerp(T.rq,k);
 hips.position.y+=((.96-T.drop)-hips.position.y)*k;lastDrop=T.drop;
 dampE(hips,'x',T.hipPitch,k);dampE(spine,'x',T.spine,k);dampE(chest,'x',T.chest,k);
 dampE(chest,'y',T.twist,k);dampE(neck,'x',T.neck,k);
 dampE(head,'x',T.headP,k);dampE(head,'y',T.headY,k);dampE(head,'z',T.headR,k);
 soldier.updateMatrixWorld(true);
 if(T.rifleMode==='hold'||T.rifleMode==='back'){
  const q=T.rlq.clone().premultiply(soldier.quaternion);
  const p=T.rlp.clone().applyQuaternion(soldier.quaternion).add(soldier.position);
  rifle.quaternion.slerp(q,k);rifle.position.lerp(p,k);rifle.visible=true;}
 else if(T.rifleMode==='drop')stepRifDrop(dt);
 if(T.name!=='throw')grenadeBelt.visible=true;
 if(S.name!=='throw')grenadeHand.visible=false;
 soldier.updateMatrixWorld(true);rifle.updateMatrixWorld(true);
 if(T.shotId!==undefined&&T.shotId!==S.firedId){S.firedId=T.shotId;
  const mp=MUZZLE.clone().applyMatrix4(rifle.matrixWorld);
  flashSprite.position.copy(mp);flashSprite.material.rotation=Math.random()*6.28;
  flashSprite.scale.set(.3,.3,1);flashSprite.visible=true;flashT=.06;
  muzzleLight.position.copy(mp);muzzleLight.intensity=25;
  const dir=V3(0,0,1).applyQuaternion(rifle.quaternion);
  spawnTracer(mp.clone().addScaledVector(dir,.3),dir);spawnSmoke(mp);}
 if(T.ikArms&&T.rifleMode!=='drop'){
  if(!T.handR){T.handR=GRIP.clone().applyQuaternion(rifle.quaternion).add(rifle.position);
   T.handL=FOREND.clone().applyQuaternion(rifle.quaternion).add(rifle.position);}
  if(T.handL){armL.sh.getWorldPosition(_v1);applyLimb(armL.sh,armL.el,_v1.clone(),T.handL,T.poleArmL,UP,FORE,k);}
  if(T.handR){armR.sh.getWorldPosition(_v1);applyLimb(armR.sh,armR.el,_v1.clone(),T.handR,T.poleArmR,UP,FORE,k);}}
 if(T.ikLegs){
  const fl=V3().copy(T.footL).applyQuaternion(soldier.quaternion).add(soldier.position);
  const fr=V3().copy(T.footR).applyQuaternion(soldier.quaternion).add(soldier.position);
  legL.hip.getWorldPosition(_v1);applyLimb(legL.hip,legL.knee,_v1.clone(),fl.add(V3(0,.085,0)),T.poleLegL,THIGH,SHIN,k);
  legR.hip.getWorldPosition(_v1);applyLimb(legR.hip,legR.knee,_v1.clone(),fr.add(V3(0,.085,0)),T.poleLegR,THIGH,SHIN,k);
  dampE(legL.ankle,'z',T.footLP,k);dampE(legR.ankle,'z',T.footRP,k);}
 if(T.exp){const E=T.exp;
  dampE(legL.hip,'x',E.lHipX,k);dampE(legR.hip,'x',E.rHipX,k);
  dampE(legL.hip,'z',E.lHipZ,k);dampE(legR.hip,'z',E.rHipZ,k);
  dampE(legL.knee,'x',E.lKnee,k);dampE(legR.knee,'x',E.rKnee,k);
  dampE(legL.ankle,'z',E.lAnk,k);dampE(legR.ankle,'z',E.rAnk,k);
  dampE(armL.sh,'x',E.lShX,k);dampE(armR.sh,'x',E.rShX,k);
  dampE(armL.sh,'z',E.lShZ,k);dampE(armR.sh,'z',E.rShZ,k);
  dampE(armL.el,'x',E.lElX,k);dampE(armR.el,'x',E.rElX,k);}
 for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.t+=dt;
  if(e.t>=e.life){scene.remove(e.m);if(e.m.material)e.m.material.dispose();effects.splice(i,1);}else e.u(e,dt);}
 for(let i=projs.length-1;i>=0;i--){const p=projs[i];p.v.y-=9.8*dt;
  p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=7*dt;p.m.rotation.z+=3*dt;
  if(p.m.position.y<=.04){spawnExplosion(p.m.position.clone());scene.remove(p.m);projs.splice(i,1);}}
 if(flashT>0){flashT-=dt;if(flashT<=0)flashSprite.visible=false;}
 muzzleLight.intensity*=Math.exp(-22*dt);
 shake*=Math.exp(-4*dt);
 const target=soldier.position.clone().add(V3(0,1.0-lastDrop*.6,0));
 const off=V3(Math.sin(camYaw)*Math.cos(camPitch),Math.sin(camPitch),Math.cos(camYaw)*Math.cos(camPitch)).multiplyScalar(camDist);
 camera.position.copy(target).add(off);
 if(shake>.002)camera.position.add(V3((Math.random()-.5),(Math.random()-.5),(Math.random()-.5)).multiplyScalar(shake*.15));
 camera.lookAt(target);
 sun.position.copy(soldier.position).add(V3(6,9,4));
 sun.target.position.copy(soldier.position);sun.target.updateMatrixWorld();
 renderer.render(scene,camera);}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
